# categories.yaml — règle de classification event → (technology, category)
#
# 2.52.0 BC3 — Nouvelle racine CAPTURE (hors tech) + Technology au-dessus
# des catégories + dédoublonnage des noms Shared qui entrent en collision
# avec un nom de catégorie LTE/NR.
#
# Hiérarchie finale rendue par build_catalog.py :
#   CAPTURE (root sans tech)
#     ├─ File  / Script / Task / Device / Identity   (5 groupes, 27 leaves)
#   tech_LTE / tech_NR / tech_Shared / tech_Other
#     └─ category
#         └─ event (ou group pour CAPTURE)
#             └─ leaf
#
# Format events: (inchangé) :
#   events:
#     <EVENT_CODE>:
#       tech: LTE | NR | Shared
#       category: <une des catégories autorisées>
#       cell_scoped: true | false            # a-t-il un champ `Cell type` ?
#       scope_field: Cell type | Scope       # discriminateur si cell_scoped
#       exclude: identity | moved_to_capture # retire l'event du pipeline événements
#
# Catégories autorisées (hors "Capture context" supprimée en 2.52.0) :
#   Serving radio · Neighbours · Carrier aggregation · Throughput per layer ·
#   Link quality · Allocation & MCS · CSI · UL power · MIMO per port ·
#   Beams NR · Voice · Application throughput · Application signalling ·
#   Services (tasks) · Position · Events ⚑ · Signalling · Scanner ·
#   Unclassified
#
# D3 BC3 2026-10-26 — Règle de nommage (jamais 2 catégories homonymes
# cross-tech sans que le niveau Technology soit visible) :
#   - "Throughput per layer"  = LTE/NR uniquement (events avec section
#     "Parameters for LTE" / "Parameters for NR")
#   - "Application throughput" = Shared (APPLIST, PPPRATE : pas de section
#     par système dans NFF 2.50)
#   - "Signalling"             = LTE/NR uniquement (RRC, HO*, RACH*, ...)
#   - "Application signalling" = Shared (SIP*, protocoles app)
#   - HANDOFF table complet dans docs/HANDOFF_shared_destination_2.52.0.md
#
# ===== CAPTURE (racine hors tech) =====
# 5 groupes × 27 feuilles. Chaque feuille porte :
#   - kind: CONST (valeur capture, répétée par ligne)
#         | SERIES (jointure (capture_id, seq))
#         | MASKED (gris, non-selectable, tooltip privacy)
#   - source: event:<EV>/<field_no> | db:<col> | derived:<rule> | series:<rule>
#   - unit, type (depuis NFF 2.50 ; vide si dérivé)
#   - description: Nemo 2.50 field description (déf ⓘ)
# Les 27 feuilles sont construites par build_catalog.py à partir de la
# section `capture:` ci-dessous ; les events source listés ici sont
# marqués `exclude: moved_to_capture` dans events: pour ne pas apparaître
# en double sous tech_Shared.
capture:
  category_label: "CAPTURE"
  category_id: "cat_CAPTURE"
  groups:
    - group_id: "grp_capture_file"
      label: "File"
      kind: CONST
      leaves:
        - {label: "Log file name",         source: "db:nmf_file.name",             type: String,  unit: null, description: "Name of the Nemo log file (.nmf) on disk."}
        - {label: "File size",             source: "derived:nmf_file_size_mb",     type: Float,   unit: "MB", description: ".nmf file size on disk, megabytes."}
        - {label: "File format version",   source: "event:#FF/1",                  type: String,  unit: null, description: "Nemo file format version string."}
        - {label: "Measurement ID",        source: "event:#ID/1",                  type: String,  unit: null, description: "Unique measurement identifier."}
        - {label: "Unit ID",               source: "event:#UNITID/1",              type: String,  unit: null, description: "Nemo unit identifier."}
        - {label: "Project ID",            source: "event:#PROJECT/1",             type: String,  unit: null, description: "Project identifier."}
        - {label: "Session ID",            source: "event:#PROJECT/2",             type: String,  unit: null, description: "Session identifier (Nemo 2.50 field #2 of #PROJECT)."}
        - {label: "Device name",           source: "event:#DN/1",                  type: String,  unit: null, description: "Measurement device name."}
        - {label: "Measurement start",     source: "event:#START/1+#UT",           type: String,  unit: null, description: "Measurement start date (#START) with UTC offset (#UT)."}
        - {label: "Decoder version",       source: "db:nmf_capture.decoder_version", type: String, unit: null, description: "Version of the BC4 NMF decoder used to decode this capture."}
        - {label: "Decode level",          source: "db:nmf_capture.level",         type: String,  unit: null, description: "Decode level of the capture (header, light, full)."}
    - group_id: "grp_capture_script"
      label: "Script"
      kind: CONST
      leaves:
        - {label: "Test script file",             source: "event:#TS/1",      type: String,  unit: null, description: "Test script file (#TS field 1, equivalent SCRIPT field 2)."}
        - {label: "Test script version",          source: "event:SCRIPT/3",   type: String,  unit: null, description: "Test script version."}
        - {label: "Test script repeats",          source: "event:SCRIPT/4",   type: Integer, unit: null, description: "Number of repeats of the test script."}
        - {label: "Number of commands in test script", source: "event:SCRIPT/6", type: Integer, unit: null, description: "Number of commands (#Test script lines) in the test script."}
    - group_id: "grp_capture_task"
      label: "Task"
      kind: SERIES
      leaves:
        - {label: "Test script command name",      source: "series:CMDREQ.2@seq_last_until_CMDCOMP", type: String,  unit: null, description: "Current test script command name (CMDREQ field 2 Cmd). Last CMDREQ with seq ≤ row until the matching CMDCOMP ; NULL outside a command window."}
        - {label: "Test script command index",     source: "series:CMDREQ.1@seq_last_until_CMDCOMP", type: Integer, unit: null, description: "Current test script command index (CMDREQ field 1 Cmd index). Displayed as [n]."}
        - {label: "Test script command arguments", source: "series:CMDREQ.3@seq_last_until_CMDCOMP_masked", type: String, unit: null, description: "Current test script command arguments (CMDREQ field 3 Cmd arguments). Numeric values masked for privacy."}
        - {label: "Test script command result",    source: "series:CMDCOMP.2@seq", type: Integer, unit: null, description: "Result of the last completed test script command (CMDCOMP field 2 Cmd result)."}
        - {label: "Command duration",              source: "series:derived:CMDCOMP.ts-CMDREQ.ts@same_cmd_index", type: Float, unit: "s", description: "Duration between CMDREQ and matching CMDCOMP for the same command index, within one capture."}
    - group_id: "grp_capture_device"
      label: "Device"
      kind: SERIES
      source_event: "DEVI"
      leaves:
        - {label: "Battery temperature",       source: "series:DEVI.1@seq", type: Float,   unit: "°C", description: "Battery temperature (DEVI field 1 Battery temp.)."}
        - {label: "Device CPU temperature",    source: "series:DEVI.7@seq", type: Float,   unit: "°C", description: "Device CPU temperature (DEVI field 7 Device CPU temp.)."}
        - {label: "Battery charge",            source: "series:DEVI.2@seq", type: Float,   unit: "%",  description: "Battery charge level (DEVI field 2 Battery charge)."}
        - {label: "Battery status",            source: "series:DEVI.3@seq", type: Integer, unit: null, description: "Battery status (DEVI field 3 Battery status)."}
        - {label: "Device battery voltage",    source: "series:DEVI.9@seq", type: Float,   unit: "V",  description: "Device battery voltage (DEVI field 9 Device battery voltage)."}
        - {label: "Device battery current",    source: "series:DEVI.5@seq", type: Float,   unit: "A",  description: "Device battery current (DEVI field 5 Device battery current)."}
    - group_id: "grp_capture_identity"
      label: "Identity"
      kind: MASKED
      leaves:
        - {label: "Subscriber identity", source: "masked:#EI,#SI,phone_numbers", type: String, unit: null, description: "Subscriber-identifying fields (IMSI, IMEI, TMSI, GUTI, MSISDN, SUPI, SUCI). Not exposed by BC4 — privacy by design."}

