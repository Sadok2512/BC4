# categories.yaml — règle de classification event → (technology, category)
#
# Phase 1 bis BC3 : 3 technologies × 17 catégories, mapping explicite depuis
# NFF 2.50. Toute entrée CSV NON classée tombe dans "Unclassified" (visible,
# comptée, jamais perdue — règle BC3).
#
# Format :
#   events:
#     <EVENT_CODE>:
#       tech: LTE | NR | Shared
#       category: <une des 17 catégories>
#       cell_scoped: true | false            # a-t-il un champ `Cell type` ?
#       scope_field: Cell type | Scope       # discriminateur si cell_scoped
#
# Catégories autorisées :
#   Serving radio · Neighbours · Carrier aggregation · Throughput per layer ·
#   Link quality · Allocation & MCS · CSI · UL power · MIMO per port ·
#   Beams NR · Voice · Services (tasks) · Position · Events ⚑ · Signalling ·
#   Capture context · Scanner · Unclassified

